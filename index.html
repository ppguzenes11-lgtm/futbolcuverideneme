<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futbol Veritabanı</title>
  <meta name="description" content="8 büyük ligin kulüpleri, kadroları ve oyuncu istatistikleri — Transfermarkt verisi">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="ust">
    <div class="ust-ic">
      <div class="logo" aria-hidden="true">⚽</div>
      <div>
        <h1>Futbol Veritabanı</h1>
        <p class="alt">8 büyük lig · 2000/01'den bugüne · Transfermarkt verisi</p>
      </div>
    </div>
  </header>

  <main class="kap">
    <section class="arac">
      <label class="alan"><span>Lig</span><select id="lig"></select></label>
      <label class="alan"><span>Sezon</span><select id="sezon"></select></label>
      <label class="alan"><span>Kulüp</span><select id="kulup"></select></label>
      <label class="alan" id="bitis-alan" style="display:none"><span>Bitiş sezonu</span><select id="sezon-bit"></select></label>
      <label class="alan" id="dizilis-alan" style="display:none"><span>Diziliş</span><select id="dizilis"></select></label>
      <label class="alan" id="mevki-alan" style="display:none"><span>Mevki</span><select id="mevki-filtre">
        <option value="">Tümü</option><option value="kaleci">Kaleci</option><option value="defans">Defans</option><option value="ortasaha">Orta saha</option><option value="hucum">Hücum</option>
      </select></label>
      <label class="alan genis"><span>Oyuncu ara</span><input id="ara" type="search" placeholder="Örn. Icardi, Messi…" autocomplete="off"></label>
    </section>

    <nav class="sekmeler" role="tablist">
      <button class="sekme aktif" data-gorunum="kulup" role="tab">Kulüp kadrosu</button>
      <button class="sekme" data-gorunum="gol" role="tab">Gol krallığı</button>
      <button class="sekme" data-gorunum="asist" role="tab">Asist krallığı</button>
      <button class="sekme" data-gorunum="enIyi11" role="tab">⭐ En iyi 11</button>
      <button class="sekme" data-gorunum="puan" role="tab">Puan sıralaması</button>
    </nav>

    <section class="ozet" id="ozet"></section>
    <section id="icerik"><div class="bilgi">Yükleniyor…</div></section>
  </main>

  <dialog id="detay">
    <div class="detay-bas">
      <h2 id="detay-ad"></h2>
      <button class="kapat" id="detay-kapat" aria-label="Kapat">×</button>
    </div>
    <div id="detay-govde"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
