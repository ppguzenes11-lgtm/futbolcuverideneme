<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galatasaray Kadroları</title>
  <meta name="description" content="2000/01 sezonundan bugüne Galatasaray kadroları">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="ust">
    <div class="ust-ic">
      <div class="logo"><span class="sari"></span><span class="kirmizi"></span></div>
      <div>
        <h1>Galatasaray Kadroları</h1>
        <p class="alt">2000/01 sezonundan bugüne · Transfermarkt verisi</p>
      </div>
    </div>
  </header>

  <main class="kap">
    <section class="arac">
      <label class="alan">
        <span>Sezon</span>
        <select id="sezon"></select>
      </label>
      <label class="alan genis">
        <span>Oyuncu ara (tüm sezonlar)</span>
        <input id="ara" type="search" placeholder="Örn. Hagi, Muslera…" autocomplete="off">
      </label>
    </section>

    <section class="ozet" id="ozet"></section>
    <section id="icerik"><div class="bilgi">Yükleniyor…</div></section>
  </main>

  <dialog id="detay">
    <div class="detay-bas">
      <h2 id="detay-ad"></h2>
      <button class="kapat" id="detay-kapat" aria-label="Kapat">×</button>
    </div>
    <div id="detay-govde"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
